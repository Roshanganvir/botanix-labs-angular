<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Precision tooling and jig design illustration</title>
<desc>Isometric 3D illustration of a precision inspection jig with a teal component and amber gauge dials</desc>
<defs>
  <linearGradient id="bgGrad3" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#181516"/>
    <stop offset="100%" stop-color="#0c0a0b"/>
  </linearGradient>
  <linearGradient id="plateGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#3c3c3c"/>
    <stop offset="100%" stop-color="#242424"/>
  </linearGradient>
  <linearGradient id="tealGrad3" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#57e6cd"/>
    <stop offset="100%" stop-color="#2aa38f"/>
  </linearGradient>
  <linearGradient id="amberGrad3" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffc266"/>
    <stop offset="100%" stop-color="#e8912a"/>
  </linearGradient>
</defs>

<rect width="800" height="600" fill="url(#bgGrad3)"/>

<!-- base plate -->
<g>
  <polygon points="180,400 400,470 620,400 400,330" fill="url(#plateGrad)"/>
  <polygon points="180,400 400,470 400,500 180,430" fill="#1c1c1c"/>
  <polygon points="620,400 400,470 400,500 620,430" fill="#232323"/>
</g>

<!-- plate bolt holes -->
<g fill="#111111">
  <ellipse cx="260" cy="400" rx="8" ry="4"/>
  <ellipse cx="540" cy="400" rx="8" ry="4"/>
  <ellipse cx="400" cy="450" rx="8" ry="4"/>
</g>

<!-- risers -->
<g fill="#2e2e2e">
  <polygon points="330,340 350,330 350,395 330,405"/>
  <polygon points="450,340 470,330 470,395 450,405"/>
</g>

<!-- component held in jig (teal cylindrical part) -->
<g>
  <ellipse cx="400" cy="255" rx="70" ry="26" fill="#3ac0a9"/>
  <rect x="330" y="255" width="140" height="70" fill="url(#tealGrad3)"/>
  <ellipse cx="400" cy="325" rx="70" ry="26" fill="#1f8a76"/>
  <ellipse cx="400" cy="255" rx="34" ry="12" fill="#123f37"/>
</g>

<!-- clamps holding component (amber) -->
<g>
  <rect x="300" y="280" width="18" height="60" rx="4" fill="url(#amberGrad3)"/>
  <rect x="482" y="280" width="18" height="60" rx="4" fill="url(#amberGrad3)"/>
  <polygon points="300,290 260,300 260,320 300,310" fill="#e8912a"/>
  <polygon points="500,290 540,300 540,320 500,310" fill="#e8912a"/>
</g>

<!-- gauge dial -->
<g>
  <circle cx="590" cy="330" r="26" fill="#2a2a2a" stroke="#ffc266" stroke-width="3"/>
  <circle cx="590" cy="330" r="3" fill="#ffc266"/>
  <line x1="590" y1="330" x2="600" y2="316" stroke="#ffc266" stroke-width="2"/>
</g>

<!-- floor shadow -->
<ellipse cx="400" cy="520" rx="230" ry="18" fill="#000000" opacity="0.35"/>
</svg>
