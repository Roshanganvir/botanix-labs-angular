<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Legacy equipment 3D reverse engineering illustration</title>
<desc>Isometric 3D illustration showing a wireframe 2D drawing transforming into a solid 3D CAD model, in amber and teal</desc>
<defs>
  <linearGradient id="bgGrad4" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#15181a"/>
    <stop offset="100%" stop-color="#0a0c0d"/>
  </linearGradient>
  <linearGradient id="solidGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffc266"/>
    <stop offset="100%" stop-color="#e0821f"/>
  </linearGradient>
</defs>

<rect width="800" height="600" fill="url(#bgGrad4)"/>

<!-- left: flat 2D drawing sheet -->
<g>
  <rect x="90" y="150" width="240" height="300" rx="4" fill="#1e1e1e" stroke="#4ddbc4" stroke-width="1.5"/>
  <g stroke="#4ddbc4" stroke-width="1.2" opacity="0.85" fill="none">
    <rect x="120" y="190" width="90" height="60"/>
    <line x1="120" y1="220" x2="210" y2="220"/>
    <circle cx="250" cy="220" r="22"/>
    <line x1="120" y1="290" x2="290" y2="290"/>
    <line x1="120" y1="330" x2="290" y2="330"/>
    <line x1="140" y1="290" x2="140" y2="330"/>
    <line x1="270" y1="290" x2="270" y2="330"/>
  </g>
  <g stroke="#2aa38f" stroke-width="0.6" opacity="0.5">
    <line x1="110" y1="380" x2="310" y2="380"/>
    <line x1="110" y1="400" x2="310" y2="400"/>
    <line x1="110" y1="420" x2="310" y2="420"/>
  </g>
</g>

<!-- arrow flow -->
<defs>
  <marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#ffc266" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<path d="M345 300 C 400 300, 400 300, 450 300" fill="none" stroke="#ffc266" stroke-width="3" marker-end="url(#arrow4)"/>

<!-- right: solid isometric 3D model built from the drawing -->
<g>
  <!-- base block -->
  <polygon points="480,340 600,300 720,340 600,380" fill="#3a3a3a"/>
  <polygon points="480,340 600,380 600,430 480,390" fill="#242424"/>
  <polygon points="720,340 600,380 600,430 720,390" fill="#2c2c2c"/>

  <!-- raised solid boss (amber, matches the circle in drawing) -->
  <polygon points="560,280 640,280 660,292 580,292" fill="url(#solidGrad)"/>
  <polygon points="560,280 580,292 580,320 560,308" fill="#c9701c"/>
  <polygon points="640,280 660,292 660,320 640,308" fill="#d9801f"/>
  <ellipse cx="600" cy="285" rx="40" ry="10" fill="#ffcf85"/>

  <!-- bracket arm (matches the rectangle in drawing) -->
  <polygon points="500,300 560,280 560,308 500,328" fill="#4ddbc4"/>
  <polygon points="500,300 500,328 480,320 480,292" fill="#2aa38f"/>
  <polygon points="500,300 560,280 560,266 500,286" fill="#5ae6cc"/>
</g>

<!-- dimension callouts on solid model -->
<g stroke="#ffc266" stroke-width="0.6" opacity="0.7">
  <line x1="600" y1="380" x2="600" y2="440"/>
  <line x1="480" y1="430" x2="720" y2="430"/>
</g>

<!-- floor shadow -->
<ellipse cx="600" cy="450" rx="150" ry="16" fill="#000000" opacity="0.35"/>
</svg>
