<section class="section" id="services">
  <div class="wrap">
    <div class="section-head" appReveal>
      <span class="eyebrow">§ 01 — Service Portfolio</span>
      <h2>Service Portfolio</h2>
    </div>
    <div class="service-grid" appReveal>
      <div class="service-card" *ngFor="let s of services">
        <div class="service-img">
          <img [src]="s.image" [alt]="s.title" loading="lazy" />
        </div>
        <span class="service-num">{{ s.num }}</span>
        <h3>{{ s.title }}</h3>
        <p>{{ s.desc }}</p>
      </div>
    </div>
  </div>
</section>
