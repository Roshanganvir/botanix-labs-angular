<section class="section-tight" id="clients">
  <div class="wrap">
    <div class="section-head" appReveal>
      <!-- <span class="eyebrow">§ 03 — Our Clients</span> -->
      <h2>Our Clients</h2>
      <p>From local partners to international manufacturers, we deliver engineering excellence our clients rely on.</p>
    </div>

    <div class="spotlight" appReveal *ngFor="let spot of spotlights">
      <div class="spotlight-head">
        <span class="mono spotlight-tag">CLIENT SPOTLIGHT</span>
        <img [src]="spot.logo" [alt]="spot.name" class="spotlight-logo" loading="lazy" />
        <p class="spotlight-sub">{{ spot.summary }}</p>
      </div>

      <div class="spotlight-grid">
        <div class="spotlight-col">
          <span class="mono col-label">THEIR CHALLENGES</span>
          <ul class="pain-list">
            <li *ngFor="let pain of spot.pains">{{ pain }}</li>
          </ul>
        </div>
        <div class="spotlight-col">
          <span class="mono col-label">HOW BOTANIX HELPED</span>
          <ul class="solution-list">
            <li *ngFor="let sol of spot.solutions">{{ sol }}</li>
          </ul>
        </div>
      </div>
    </div>

    <!-- Manufacturing Partner Card -->
       <!-- Manufacturing Partner Card -->
    <div class="partner-card" appReveal>
      <div class="partner-head">
        <!-- <span class="mono partner-tag">MANUFACTURING PARTNER</span> -->
        <h3 class="partner-name">{{ partner.name }}</h3>
      </div>
      <p class="partner-desc">{{ partner.summary }}</p>
      <div class="partner-caps">
        <span class="mono col-label">CAPABILITIES</span>
        <ul class="cap-list">
          <li *ngFor="let cap of partner.capabilities">{{ cap }}</li>
        </ul>
      </div>
    </div>
  </div>
</section>
